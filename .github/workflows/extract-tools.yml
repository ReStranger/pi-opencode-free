name: Sync OpenCode Upstream Contract

on:
  schedule:
    # Run daily at 06:00 UTC to detect newly released OpenCode versions
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Target release tag in anomalyco/opencode (default: latest stable vX.Y.Z)"
        required: false
        type: string

concurrency:
  group: sync-opencode-upstream-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-contract:
    name: Extract & Sync Upstream Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Extract genuine tool catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            bun run extract-tools --tag "${{ inputs.tag }}"
          else
            bun run extract-tools
          fi

      - name: Extract client User-Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            bun run extract-user-agent --tag "${{ inputs.tag }}"
          else
            bun run extract-user-agent
          fi

      - name: Run typecheck and tests
        run: |
          bun run typecheck
          bun test src/

      - name: Commit and push changes if upstream changed
        run: |
          if git diff --quiet -- src/opencode-tools.json src/zen-headers.ts; then
            echo "No upstream changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/opencode-tools.json src/zen-headers.ts
          git commit -m "chore(upstream): sync tools and User-Agent with anomalyco/opencode"
          git push origin "HEAD:${GITHUB_REF_NAME}"
